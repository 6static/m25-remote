name: Enclosure site

on:
  push:
    branches: [main]
    paths: ["enclosure/**", "enclosure-site/**", ".github/workflows/enclosure-site.yml"]
  workflow_dispatch:
    inputs:
      regen:
        description: "Regenerate the enclosure from enclosure.py first"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: enclosure-site/requirements.txt
      - run: pip install -r enclosure-site/requirements.txt
      - run: python enclosure-site/build.py ${{ inputs.regen && '--regen' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: enclosure-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
